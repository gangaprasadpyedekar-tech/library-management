<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library Management System (LMS) — Next-Gen Library Command Center</title>
  <meta name="description" content="Automated Library Management System for book cataloging, member registration, circulation tracking, due-date calculation, fines ledger, and reporting.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- App Header & Navigation Bar -->
  <nav class="navbar">
    <a href="#" class="brand" onclick="window.app.switchView('dashboard'); return false;">
      <div class="brand-icon">📚</div>
      <div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <span class="brand-title">ATHENA LMS</span>
          <span class="brand-badge">PRO v2.4</span>
        </div>
      </div>
    </a>

    <!-- Navigation Tabs -->
    <div class="nav-center">
      <button class="nav-tab active" data-view="dashboard">
        <span>📊 Dashboard</span>
      </button>
      <button class="nav-tab" data-view="books">
        <span>📖 Books Catalog</span>
      </button>
      <button class="nav-tab" data-view="members">
        <span>👥 Members</span>
      </button>
      <button class="nav-tab" data-view="circulation">
        <span>🔄 Circulation Desk</span>
        <span id="nav-badge-overdue" class="badge badge-overdue" style="display: none; padding: 1px 6px; font-size: 0.7rem;"></span>
      </button>
      <button class="nav-tab" data-view="fines">
        <span>💰 Fines & Overdues</span>
      </button>
      <button class="nav-tab" data-view="reports">
        <span>📈 Reports</span>
      </button>
    </div>

    <!-- Right Controls: Role Switcher -->
    <div class="nav-right">
      <div class="role-switcher">
        <span style="color: var(--text-muted);">Mode:</span>
        <select id="role-select" class="role-select">
          <option value="Librarian" selected>👑 Librarian (Admin)</option>
          <option value="Member">🎓 Student / Member View</option>
        </select>
      </div>
    </div>
  </nav>

  <!-- Main View Content Injection Container -->
  <main class="container" id="app-main-content">
    <!-- View content rendered dynamically by JS -->
  </main>

  <!-- Global Modal Window Overlay -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-title">Modal Title</h3>
        <button class="modal-close" id="modal-close-btn">&times;</button>
      </div>
      <div class="modal-body" id="modal-body">
        <!-- Dynamic modal form or details -->
      </div>
      <div class="modal-footer" id="modal-footer">
        <!-- Dynamic modal buttons -->
      </div>
    </div>
  </div>

  <!-- JavaScript Modules -->
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/components/toast.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/books.js"></script>
  <script src="js/views/members.js"></script>
  <script src="js/views/circulation.js"></script>
  <script src="js/views/fines.js"></script>
  <script src="js/views/reports.js"></script>
  <script src="js/app.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      window.app.init();
    });
  </script>
</body>
</html>
